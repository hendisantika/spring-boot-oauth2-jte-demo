version: 2
updates:
  # Maven dependencies (pom.xml)
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    assignees:
      - hendisantika
    labels:
      - dependencies
      - java
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: scope
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework.security:*"
      jte:
        patterns:
          - "gg.jte:*"
      maven-plugins:
        patterns:
          - "org.apache.maven*"
          - "*:*-maven-plugin"
      test-dependencies:
        dependency-type: development

  # GitHub Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    assignees:
      - hendisantika
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
